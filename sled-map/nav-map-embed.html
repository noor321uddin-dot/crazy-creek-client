<!-- ============================================================
     CRAZY CREEK — SLED ZONE NAVIGATION MAP  ·  GHL EMBED BLOCK
     ------------------------------------------------------------
     A REAL interactive map (Leaflet + OpenTopoMap) guests use to
     reach the sled staging areas:
       · home view always centered on Crazy Creek Resort, gold
         bearing lines pointing to every zone
       · "locate me" shows the guest's live position
       · every zone: compass bearing + straight-line distance,
         and GET DIRECTIONS → opens Google Maps turn-by-turn
     HOW TO ADD IN GHL: page → Edit → "Custom JS/HTML" element →
     paste ALL of this → Save → check in Preview (not the builder).
     Scoped under .ccnav — will not restyle the host page.
     ============================================================ -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  .ccnav{
    --green-900:#0E241B; --green-800:#123024; --green-700:#1E5A41;
    --gold:#D9A441; --gold-soft:#E6C078; --cream:#FBF8F1;
    width:100%; max-width:1200px; margin:0 auto;
    font-family:'Inter',system-ui,Helvetica,Arial,sans-serif; color:var(--cream);
    container-type:inline-size; container-name:ccnav;
  }
  .ccnav, .ccnav *{box-sizing:border-box}

  .ccnav-frame{
    background:var(--green-900); border-radius:14px; overflow:hidden;
    border:1px solid rgba(230,192,120,.25);
  }
  .ccnav-head{padding:clamp(14px,2.4cqw,24px) clamp(16px,2.8cqw,28px) clamp(10px,1.6cqw,16px);text-align:center}
  .ccnav-kicker{
    font-size:clamp(9px,1cqw,12px);letter-spacing:.28em;text-transform:uppercase;
    font-weight:600;color:var(--gold);margin:0 0 4px;
  }
  .ccnav-kicker::before{content:"";display:inline-block;width:20px;height:1px;background:var(--gold);margin-right:8px;vertical-align:middle;opacity:.9}
  .ccnav-title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(20px,3cqw,34px);line-height:1.05;margin:0;color:var(--cream)}
  .ccnav-sub{margin:6px auto 0;max-width:68ch;font-size:clamp(11px,1.2cqw,14px);color:rgba(251,248,241,.75);line-height:1.5}

  .ccnav-mapwrap{position:relative}
  #ccnav-map{height:clamp(340px,46cqw,560px);width:100%;background:#0E241B}
  .ccnav-rose{
    position:absolute;top:12px;right:12px;z-index:900;pointer-events:none;
    width:clamp(44px,7cqw,64px);height:clamp(44px,7cqw,64px);opacity:.95;
  }

  /* Leaflet chrome, on brand */
  .ccnav .leaflet-container{font-family:'Inter',sans-serif}
  .ccnav .leaflet-bar a{background:var(--green-800);color:var(--cream);border-color:rgba(230,192,120,.3)}
  .ccnav .leaflet-bar a:hover{background:var(--green-700)}
  .ccnav .leaflet-bar a.ccnav-ctlbtn svg{width:15px;height:15px;vertical-align:middle}
  .ccnav .leaflet-control-attribution{background:rgba(14,36,27,.8);color:rgba(251,248,241,.6);font-size:9px}
  .ccnav .leaflet-control-attribution a{color:var(--gold-soft)}

  /* markers */
  .ccnav-mk{display:block}
  .ccnav-mk .d{
    display:block;width:20px;height:20px;background:var(--gold);border:2px solid #0E241B;border-radius:4px;
    transform:rotate(45deg);box-shadow:0 2px 8px rgba(0,0,0,.55);
  }
  .ccnav-mk .z{
    display:block;width:18px;height:18px;background:var(--cream);border:3px solid var(--gold);border-radius:50%;
    box-shadow:0 2px 8px rgba(0,0,0,.55);
  }
  .ccnav-mk .z.est{background:var(--green-800);border-style:dashed;border-color:var(--gold-soft)}
  .ccnav-mk .u{
    display:block;position:relative;width:16px;height:16px;background:var(--cream);
    border:3px solid var(--green-700);border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.55);
  }
  .ccnav-mk .u::after{
    content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--cream);
    animation:ccnavPing 2s ease-out infinite;
  }
  @keyframes ccnavPing{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}

  /* permanent pin labels */
  .ccnav .ccnav-lbl{
    background:rgba(14,36,27,.82);color:var(--cream);border:1px solid rgba(230,192,120,.35);
    border-radius:6px;padding:2px 7px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
    box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap;
  }
  .ccnav .ccnav-lbl-base{color:var(--gold-soft)}
  .ccnav .ccnav-lbl::before{display:none}   /* no tooltip arrow */

  /* popup, on brand */
  .ccnav .leaflet-popup-content-wrapper{
    background:rgba(18,48,36,.96);color:var(--cream);border:1px solid rgba(230,192,120,.35);
    border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.5);
  }
  .ccnav .leaflet-popup-tip{background:rgba(18,48,36,.96)}
  .ccnav .leaflet-popup-content{margin:14px 16px 14px}
  .ccnav-pop h3{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:18px;margin:0 0 2px;color:var(--cream)}
  .ccnav-pop .tag{font-size:9px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--gold)}
  .ccnav-pop .facts{margin:8px 0 0;font-size:12.5px;line-height:1.5;color:rgba(251,248,241,.85)}
  .ccnav-pop .bear{margin:6px 0 0;font-size:11px;color:var(--gold-soft)}
  .ccnav-pop .est{margin:8px 0 0;font-size:10.5px;color:var(--gold-soft)}
  .ccnav-pop .go{
    display:inline-block;margin-top:10px;padding:9px 16px;background:var(--gold);color:#123024;
    font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
    border-radius:8px;cursor:pointer;transition:background .2s ease;
  }
  .ccnav-pop .go:hover{background:var(--gold-soft)}

  /* directions strip below the map — the glove-friendly path */
  .ccnav-strip{display:grid;gap:8px;padding:clamp(12px,2cqw,20px) clamp(16px,2.8cqw,28px) clamp(16px,2.4cqw,24px);grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .ccnav-item{
    background:var(--green-800);border:1px solid rgba(230,192,120,.22);border-radius:10px;
    padding:12px 14px;display:flex;flex-direction:column;gap:6px;
  }
  .ccnav-item .zn{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15.5px;color:var(--cream)}
  .ccnav-item .zb{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-soft)}
  .ccnav-item .zi{font-size:11.5px;color:rgba(251,248,241,.7);line-height:1.45}
  .ccnav-item .ze{font-size:10px;color:var(--gold-soft)}
  .ccnav-item a.go{
    margin-top:auto;align-self:flex-start;padding:8px 14px;background:transparent;color:var(--gold);
    border:1px solid var(--gold);border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .2s ease,color .2s ease;
  }
  .ccnav-item a.go:hover{background:var(--gold);color:#123024}
  .ccnav-note{
    padding:0 clamp(16px,2.8cqw,28px) clamp(14px,2cqw,20px);font-size:10.5px;line-height:1.5;
    color:rgba(251,248,241,.55);
  }
  .ccnav-note a{color:var(--gold-soft)}

  @media (prefers-reduced-motion:reduce){
    .ccnav *{transition:none !important;animation:none !important}
  }
</style>

<div class="ccnav" id="ccnav-root">
  <div class="ccnav-frame">
    <div class="ccnav-head">
      <p class="ccnav-kicker">Crazy Creek Resort · Malakwa, BC</p>
      <h2 class="ccnav-title">Find your riding zone</h2>
      <p class="ccnav-sub">The map starts at the resort — gold lines point toward every staging area. Tap a pin, then hit <strong>Get directions</strong> for turn-by-turn from wherever you are. <strong>⛶</strong> shows all five zones at once, <strong>⌂</strong> brings you back to the resort, <strong>⌖</strong> shows your position.</p>
    </div>
    <div class="ccnav-mapwrap">
      <div id="ccnav-map" role="region" aria-label="Interactive map of snowmobile staging areas around Crazy Creek Resort"></div>
      <svg class="ccnav-rose" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="47" fill="rgba(10,26,19,.82)"/>
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(230,192,120,.5)" stroke-width="1.6"/>
        <circle cx="50" cy="50" r="36.5" fill="none" stroke="rgba(230,192,120,.18)" stroke-width="1"/>
        <g stroke="rgba(251,248,241,.55)" stroke-width="1.6">
          <line x1="50" y1="7" x2="50" y2="12"/><line x1="50" y1="88" x2="50" y2="93"/>
          <line x1="7" y1="50" x2="12" y2="50"/><line x1="88" y1="50" x2="93" y2="50"/>
        </g>
        <path d="M22 50 L50 45.5 L78 50 L50 54.5 Z" fill="rgba(251,248,241,.28)"/>
        <path d="M50 24 L56 50 L50 47.5 L44 50 Z" fill="#D9A441"/>
        <path d="M50 76 L44 50 L50 52.5 L56 50 Z" fill="rgba(251,248,241,.5)"/>
        <circle cx="50" cy="50" r="2.6" fill="#D9A441" stroke="#0E241B" stroke-width="1"/>
        <text x="50" y="20.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#E6C078" letter-spacing="1">N</text>
      </svg>
    </div>
    <div class="ccnav-strip" id="ccnav-strip"></div>
    <p class="ccnav-note" id="ccnav-note"></p>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- locations (researched 2026-08-26; every coordinate sourced) ----------
     `est` = staging point NOT club-published (verify before towing).
     Sources: Eagle Valley Snowmobile Club overview map (sledsicamous.com),
     Trailforks trailhead pins, AllTrails geo, sledrevelstoke.com, Google
     place pin at the verified street address. Old Queest FSR staging is
     DEPRECATED (club notice Mar 2024) — current pin is the Sicamous one. */
  var BASE={ name:'Crazy Creek Resort', lat:50.99593, lng:-118.64522,
             facts:'Base camp — hot pools, cabins, gear drying overnight. 6162 Trans-Canada Hwy, Malakwa.' };
  var ZONES=[
    { name:'Eagle Pass',       lat:51.00289, lng:-118.69137, facts:'Backcountry + powder · 300cm+ snowpack. Trailhead parking ~2 km from the resort, off Crazy Creek FSR.', est:false },
    { name:'Frisby Ridge',     lat:51.05472, lng:-118.26110, facts:'Groomed climb to alpine · 280cm snowpack. Staging at the end of Westside Rd, Revelstoke (under the powerlines).', est:true },
    { name:'Boulder Mountain', lat:51.00618, lng:-118.26184, facts:'Alpine bowls · terrain figures to confirm with the resort. Staging off Westside Rd, ~4 km west of Revelstoke.', est:false },
    { name:'Owlhead',          lat:50.83776, lng:-118.95616, facts:'Trees + alpine · terrain figures to confirm with the resort. Staging at Owlhead FSR, 3 minutes from downtown Sicamous.', est:false, lbl:'bottom' },
    { name:'Queest Mountain',  lat:50.84787, lng:-118.96630, facts:'Alpine + meadows · terrain figures to confirm with the resort. New Sicamous trailhead (staging moved here Mar 2024).', est:false }
  ];
  var NOTE='Staging locations compiled from Eagle Valley &amp; Revelstoke snowmobile-club maps, Trailforks and AllTrails (Aug 2026). Frisby Ridge staging is approximate — verify with the club before towing.';

  function dirUrl(lat,lng){return 'https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng;}

  /* great-circle distance + initial bearing (for "NE · 38 km line-of-sight") */
  function distBearing(lat1,lon1,lat2,lon2){
    var R=6371,toR=Math.PI/180;
    var f1=lat1*toR,f2=lat2*toR,df=(lat2-lat1)*toR,dl=(lon2-lon1)*toR;
    var a=Math.sin(df/2)*Math.sin(df/2)+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2);
    var d=2*R*Math.asin(Math.sqrt(a));
    var y=Math.sin(dl)*Math.cos(f2), x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
    var b=(Math.atan2(y,x)/toR+360)%360;
    return {km:d,deg:b};
  }
  function compass8(deg){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
  function bearingText(z){
    if(BASE.lat===null||z.lat===null)return '';
    var db=distBearing(BASE.lat,BASE.lng,z.lat,z.lng);
    return compass8(db.deg)+' · '+db.km.toFixed(0)+' km line-of-sight from the resort';
  }

  /* ---------- directions strip: plain HTML, works even if Leaflet fails ---------- */
  function buildStrip(){
    var strip=document.getElementById('ccnav-strip');
    if(!strip||strip.childNodes.length)return;
    ZONES.forEach(function(z){
      if(z.lat===null)return;
      var d=document.createElement('div');
      d.className='ccnav-item';
      var bt=bearingText(z);
      d.innerHTML='<span class="zn">'+z.name+'</span>'+
                  (bt?'<span class="zb">'+bt+'</span>':'')+
                  '<span class="zi">'+z.facts+'</span>'+
                  (z.est?'<span class="ze">Staging point researched — verify with the resort before towing.</span>':'')+
                  '<a class="go" target="_blank" rel="noopener" href="'+dirUrl(z.lat,z.lng)+'">Get directions</a>';
      strip.appendChild(d);
    });
    var noteEl=document.getElementById('ccnav-note');
    if(noteEl&&!noteEl.innerHTML)noteEl.innerHTML=NOTE+' Always check <a href="https://avalanche.ca" target="_blank" rel="noopener">avalanche.ca</a> conditions before riding.';
  }

  /* ---------- map ---------- */
  function buildMap(){
    var mapDiv=document.getElementById('ccnav-map');
    if(!mapDiv||mapDiv.dataset.ccnavInit)return;          // missing markup or GHL re-ran the script
    if(typeof L==='undefined'){setTimeout(buildMap,150);return;} // Leaflet still loading
    if(BASE.lat===null)return;                             // no base coordinate, nothing to draw
    mapDiv.dataset.ccnavInit='1';

    var map=L.map(mapDiv,{scrollWheelZoom:false});
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
      maxZoom:16,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
    }).addTo(map);
    map.on('click focus',function(){map.scrollWheelZoom.enable();});
    map.on('mouseout',function(){map.scrollWheelZoom.disable();});

    function icon(cls){return L.divIcon({className:'ccnav-mk',html:'<span class="'+cls+'"></span>',iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-12]});}
    function pop(title,tag,facts,bear,est,lat,lng){
      return '<div class="ccnav-pop"><span class="tag">'+tag+'</span><h3>'+title+'</h3>'+
             '<p class="facts">'+facts+'</p>'+
             (bear?'<p class="bear">'+bear+'</p>':'')+
             (est?'<p class="est">Staging point researched — verify with the resort before towing.</p>':'')+
             '<a class="go" target="_blank" rel="noopener" href="'+dirUrl(lat,lng)+'">Get directions</a></div>';
    }

    /* home view: SYMMETRIC bounds around the resort so it is always dead-center */
    var maxDLat=0.02,maxDLng=0.02;
    ZONES.forEach(function(z){
      if(z.lat===null)return;
      maxDLat=Math.max(maxDLat,Math.abs(z.lat-BASE.lat));
      maxDLng=Math.max(maxDLng,Math.abs(z.lng-BASE.lng));
    });
    var homeBounds=[[BASE.lat-maxDLat*1.15,BASE.lng-maxDLng*1.15],[BASE.lat+maxDLat*1.15,BASE.lng+maxDLng*1.15]];
    /* default = CLOSE-UP on the resort (Eagle Pass in frame, bearing lines
       running off-screen toward the far zones); ⛶ shows all five zones */
    function homeView(){map.setView([BASE.lat,BASE.lng],12);}
    homeView();

    /* resort marker */
    L.marker([BASE.lat,BASE.lng],{icon:icon('d'),title:BASE.name,alt:BASE.name,zIndexOffset:500})
      .addTo(map).bindPopup(pop(BASE.name,'Base camp',BASE.facts,'',false,BASE.lat,BASE.lng))
      .bindTooltip(BASE.name,{permanent:true,direction:'bottom',offset:[0,12],className:'ccnav-lbl ccnav-lbl-base'});

    /* zone pins + bearing lines pointing out from the resort
       (dark casing under the gold dash so the line reads on tan terrain) */
    ZONES.forEach(function(z){
      if(z.lat===null)return;
      L.polyline([[BASE.lat,BASE.lng],[z.lat,z.lng]],{color:'#0E241B',weight:4,opacity:.55}).addTo(map);
      L.polyline([[BASE.lat,BASE.lng],[z.lat,z.lng]],{color:'#E6C078',weight:1.8,opacity:.95,dashArray:'3 7'}).addTo(map);
      L.marker([z.lat,z.lng],{icon:icon(z.est?'z est':'z'),title:z.name,alt:z.name+' staging area'})
        .addTo(map).bindPopup(pop(z.name,'Staging area',z.facts,bearingText(z),z.est,z.lat,z.lng))
        .bindTooltip(z.name,{permanent:true,direction:z.lbl||'top',offset:[0,z.lbl==='bottom'?12:-12],className:'ccnav-lbl'});
    });

    /* custom controls: ⌂ home + ⌖ locate-me */
    var userMk=null,userRing=null;
    var Ctl=L.Control.extend({
      options:{position:'topleft'},
      onAdd:function(){
        var bar=L.DomUtil.create('div','leaflet-bar');
        var home=L.DomUtil.create('a','ccnav-ctlbtn',bar);
        home.href='#';home.title='Back to the resort';home.setAttribute('aria-label','Center map on Crazy Creek Resort');
        home.innerHTML='<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="2" transform="rotate(45 12 12)" fill="#D9A441"/></svg>';
        L.DomEvent.on(home,'click',function(e){L.DomEvent.stop(e);map.closePopup();homeView();});
        var all=L.DomUtil.create('a','ccnav-ctlbtn',bar);
        all.href='#';all.title='Show all riding zones';all.setAttribute('aria-label','Zoom out to show all riding zones');
        all.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2" stroke-linecap="round"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg>';
        L.DomEvent.on(all,'click',function(e){L.DomEvent.stop(e);map.closePopup();map.fitBounds(homeBounds);});
        var loc=L.DomUtil.create('a','ccnav-ctlbtn',bar);
        loc.href='#';loc.title='Show my location';loc.setAttribute('aria-label','Show my location on the map');
        loc.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
        L.DomEvent.on(loc,'click',function(e){
          L.DomEvent.stop(e);
          map.locate({enableHighAccuracy:true,timeout:12000,maximumAge:30000});
        });
        return bar;
      }
    });
    map.addControl(new Ctl());

    map.on('locationfound',function(ev){
      if(userMk){userMk.setLatLng(ev.latlng);userRing.setLatLng(ev.latlng).setRadius(ev.accuracy);}
      else{
        userMk=L.marker(ev.latlng,{icon:icon('u'),title:'You are here',alt:'Your location'}).addTo(map);
        userRing=L.circle(ev.latlng,{radius:ev.accuracy,color:'#FBF8F1',weight:1,opacity:.4,fillColor:'#FBF8F1',fillOpacity:.08}).addTo(map);
      }
      map.fitBounds(L.latLngBounds([ev.latlng,[BASE.lat,BASE.lng]]).pad(0.25));
    });
    map.on('locationerror',function(){
      var n=document.getElementById('ccnav-note');
      if(n)n.innerHTML='Location unavailable or permission denied — the <strong>Get directions</strong> buttons still open full navigation. '+n.innerHTML;
    });
  }

  function init(){buildStrip();buildMap();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
